<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" role="img" aria-label="Simulation in production: the real system is modelled, programs and experiments are run on the model to get formal results, and the solution is then applied to the real system.">
