<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Ziegler-Nichols second method: with P control only, the gain is raised until the output oscillates with constant amplitude. That gain is the critical gain Kcr, and the time between peaks is the critical period Pcr.">
