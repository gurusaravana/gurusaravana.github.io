<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="H-bridge and PWM drive: switches TR1 and TR4 on send current forward through the motor, TR2 and TR3 on reverse it; never turn on both switches of one side. A PWM signal with duty ratio D gives an average voltage D times the supply.">
