<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="A common digital control configuration: external input to a computer or microprocessor, a DAC, the analog subsystem giving the analog output, and an ADC feeding the output back to the computer.">
<title>A common digital control configuration: external input to a computer or microprocessor, a DAC, the analog subsystem giving the analog output, and an ADC feeding the output back to the computer.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="720" height="240" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="46.0" y="56.0" font-size="13" text-anchor="middle" fill="#db2777" font-weight="400">External input</text>
<path d="M10.0 70.0 L100.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="100.0" y="43.0" width="140.0" height="54.0" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="170.0" y="66.5" font-size="14" text-anchor="middle" fill="#059669" font-weight="400">Computer or</text>
<text x="170.0" y="83.5" font-size="14" text-anchor="middle" fill="#059669" font-weight="400">microprocessor</text>
<path d="M240.0 70.0 L300.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="300.0" y="48.0" width="80.0" height="44.0" rx="4" fill="#fff" stroke="#ea7a1f" stroke-width="2"/>
<text x="340.0" y="75.0" font-size="15" text-anchor="middle" fill="#ea7a1f" font-weight="400">DAC</text>
<path d="M380.0 70.0 L440.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="440.0" y="43.0" width="140.0" height="54.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="510.0" y="66.5" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">Analog</text>
<text x="510.0" y="83.5" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">subsystem</text>
<path d="M580.0 70.0 L704.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="660.0" y="56.0" font-size="13" text-anchor="middle" fill="#db2777" font-weight="400">Analog output</text>
<circle cx="640.0" cy="70.0" r="4" fill="#0f172a"/>
<path d="M640.0 70.0 L640.0 170.0 L550.0 170.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<rect x="470.0" y="150.0" width="80.0" height="40.0" rx="4" fill="#fff" stroke="#ea7a1f" stroke-width="2"/>
<text x="510.0" y="175.0" font-size="14" text-anchor="middle" fill="#ea7a1f" font-weight="400">ADC</text>
<path d="M470.0 170.0 L170.0 170.0 L170.0 97.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<rect x="290.0" y="30.0" width="300.0" height="168.0" rx="10" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="440.0" y="226.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">this cascade has a z-transfer function G_ZAS(z)</text>
</g>
</svg>
