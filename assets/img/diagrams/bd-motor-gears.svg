<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 110" width="640" height="110" role="img" aria-label="Motor and gearbox as blocks: voltage V(s) into motor G(s) gives torque T(s), gears H(s) turn torque into speed omega(s)">
<title>Motor and gearbox as blocks: voltage V(s) into motor G(s) gives torque T(s), gears H(s) turn torque into speed omega(s)</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="110" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<path d="M20.0 60.0 L150.0 60.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="80" y="48" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400">Voltage V(s)</text>
<rect x="152.0" y="35.0" width="116.0" height="50" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="210" y="56.5" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">Motor</text>
<text x="210" y="73.3" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">G(s)</text>
<path d="M268.0 60.0 L392.0 60.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="330" y="48" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400">Torque T(s)</text>
<rect x="392.0" y="35.0" width="116.0" height="50" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="450" y="56.5" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">Gears</text>
<text x="450" y="73.3" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">H(s)</text>
<path d="M508.0 60.0 L625.0 60.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="565" y="48" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400">Speed ω(s)</text>
</g>
</svg>
