<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-label="Six z-plane pole positions and the impulse responses they produce: a positive real pole inside the circle decays smoothly, a negative real pole alternates in sign, a pole at z = 1 gives a constant, a pole outside the circle grows, complex poles inside give a decaying oscillation and complex poles on the circle give a sustained oscillation.">
