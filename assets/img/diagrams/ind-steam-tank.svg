<rect width="640" height="310" fill="#ffffff"/>
<g fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" font-family="Inter, Arial, sans-serif">
<rect x="221" y="120" width="198" height="139" fill="#fed7aa" stroke="none" opacity=".75"/><path d="M220 90V260H420V90"/>
<path d="M320 70V180" /><path d="M300 180H340 M306 170l28 20 M334 170l-28 20" stroke-width="2"/><text x="332" y="80" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="start">stirrer</text>
<path d="M30 110H220" /><path d="M150 110H210" stroke="#0284c7" marker-end="url(#ak)"/><text x="30" y="100" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="start">cold inflow, θᵢₙ</text>
<path d="M420 240H610"/><path d="M540 240H600" marker-end="url(#ak)"/><text x="610" y="262" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="end">heated outflow, θ</text>
<path d="M30 200H110 M134 200H240q20 -20 40 0t40 0t40 0t40 0V230H40" stroke="#ea580c"/><path d="M110 188L134 212V188L110 212Z" fill="#fff"/><path d="M122 200V178 M108 178a14 14 0 0 1 28 0Z" fill="#e0e7ff" stroke="#4f46e5"/><text x="30" y="190" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="start">steam</text><text x="40" y="250" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="start">condensate</text>
<path d="M420 160H470"/><circle cx="492" cy="160" r="20" fill="#fff" stroke="#4f46e5"/><text x="492" y="165" fill="#4f46e5" stroke="none" font-size="13" text-anchor="middle" font-weight="600">TT</text>
<circle cx="492" cy="60" r="20" fill="#fff" stroke="#4f46e5"/><text x="492" y="65" fill="#4f46e5" stroke="none" font-size="13" text-anchor="middle" font-weight="600">TC</text>
<path d="M492 140V82" stroke="#4f46e5" stroke-dasharray="6 5" marker-end="url(#ai)"/><path d="M472 60H180V150H122V166" stroke="#4f46e5" stroke-dasharray="6 5" marker-end="url(#ai)"/>
<path d="M610 60H515" stroke="#db2777" marker-end="url(#ar)"/><text x="615" y="50" fill="#db2777" stroke="none" font-size="13" text-anchor="end" font-weight="500">set-point</text>
<text x="320" y="296" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="middle">Heat added by the coil reaches the thermocouple only after a dead time L</text>
