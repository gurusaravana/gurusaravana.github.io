<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-label="Steam-heated stirred tank: cold liquid flows in and heated liquid flows out. Steam from the boiler passes through a control valve into a heating coil. A thermocouple TT measures the tank temperature; the temperature controller TC compares it with the set-point and moves the steam valve.">
<title>Steam-heated stirred tank: cold liquid flows in and heated liquid flows out. Steam from the boiler passes through a control valve into a heating coil. A thermocouple TT measures the tank temperature; the temperature controller TC compares it with the set-point and moves the steam valve.</title>
