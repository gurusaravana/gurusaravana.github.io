<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Conveyor drive speed loop: the speed set-point and the tachometer speed are compared by a PI controller, which sets the drive voltage, limited to plus or minus 100 volts. The voltage drives a dc motor that turns the conveyor belt drum. Material dropped on the belt adds load torque.">
<title>Conveyor drive speed loop: the speed set-point and the tachometer speed are compared by a PI controller, which sets the drive voltage, limited to plus or minus 100 volts. The voltage drives a dc motor that turns the conveyor belt drum. Material dropped on the belt adds load torque.</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs>
<rect width="640" height="280" fill="#ffffff"/>
<g fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" font-family="Inter, Arial, sans-serif">
<circle cx="70" cy="70" r="14" fill="#fff"/><path d="M62 70H78 M70 62V78" stroke-width="1.6"/><path d="M10 70H54" stroke="#db2777" marker-end="url(#ar)"/><text x="10" y="58" fill="#db2777" stroke="none" font-size="13" text-anchor="start" font-weight="500">ω*</text>
<rect x="110" y="45" width="100" height="50" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="160" y="76" fill="#4f46e5" stroke="none" font-size="14" text-anchor="middle" font-weight="600">PI</text><path d="M84 70H108" marker-end="url(#ak)"/>
<rect x="240" y="45" width="100" height="50" rx="8" fill="#fff"/><path d="M255 82H275L305 58H325" stroke="#ea580c"/><text x="290" y="112" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="middle">limit ±100 V</text><path d="M210 70H238" marker-end="url(#ak)"/>
<rect x="370" y="45" width="100" height="50" rx="8" fill="#fff"/><text x="420" y="76" fill="#0f172a" stroke="none" font-size="14" text-anchor="middle" font-weight="600">dc motor</text><path d="M340 70H368" marker-end="url(#ak)"/><text x="354" y="62" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="middle">v</text>
<path d="M470 70H520V150"/><circle cx="520" cy="180" r="28" fill="#f1f5f9"/><circle cx="300" cy="180" r="28" fill="#f1f5f9"/><path d="M300 152H520 M300 208H520"/>
<rect x="360" y="132" width="40" height="20" fill="#a3a3a3" stroke="none"/><rect x="420" y="132" width="30" height="20" fill="#a3a3a3" stroke="none"/><path d="M430 112V128" stroke="#db2777" marker-end="url(#ar)"/><text x="440" y="122" fill="#db2777" stroke="none" font-size="12.5" text-anchor="start" font-weight="500">load torque</text>
<circle cx="580" cy="180" r="18" fill="#fff" stroke="#4f46e5"/><text x="580" y="185" fill="#4f46e5" stroke="none" font-size="12" text-anchor="middle" font-weight="600">ST</text><path d="M548 180H562" stroke="#4f46e5"/>
<path d="M580 198V250H70V86" stroke="#4f46e5" stroke-dasharray="6 5" marker-end="url(#ai)"/><text x="78" y="110" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="start">−</text><text x="320" y="268" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="middle">tachometer (ST) feeds back the belt speed ω</text>
</g></svg>
