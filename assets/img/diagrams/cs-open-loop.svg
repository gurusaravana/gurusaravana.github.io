<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-label="Open-loop control: the reference goes to the controller, then to the plant; a disturbance acts on the plant and nothing measures the output">
<title>Open-loop control: the reference goes to the controller, then to the plant; a disturbance acts on the plant and nothing measures the output</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="720" height="190" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="60" y="87.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="600">Reference</text>
<text x="60" y="104.5" font-size="14" text-anchor="middle" fill="#db2777" font-weight="600">input</text>
<path d="M105.0 95.0 L188.0 95.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="190.0" y="72.0" width="120.0" height="46" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="250" y="100.6" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="400">Controller</text>
<path d="M310.0 95.0 L418.0 95.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="420.0" y="72.0" width="140.0" height="46" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="490" y="91.5" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">Process /</text>
<text x="490" y="108.3" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">plant</text>
<path d="M560.0 95.0 L650.0 95.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="680" y="100" font-size="14" text-anchor="middle" fill="#db2777" font-weight="600">Output</text>
<text x="364" y="28" font-size="13" text-anchor="middle" fill="#ea7a1f" font-weight="600">Disturbance</text>
<path d="M364.0 36.0 L364.0 91.0" fill="none" stroke="#ea7a1f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ao)"/>
<text x="250" y="143.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">works out the</text>
<text x="250" y="158.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">control action</text>
<text x="490" y="143.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">system being</text>
<text x="490" y="158.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">controlled</text>
<text x="680" y="125.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">actual</text>
<text x="680" y="140.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">result</text>
</g>
</svg>
