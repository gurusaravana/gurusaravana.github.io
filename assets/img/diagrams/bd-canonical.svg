<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Canonical feedback loop: R(s) minus B(s) gives the error E(s), G(s) gives C(s), and H(s) feeds C back as B(s)">
<title>Canonical feedback loop: R(s) minus B(s) gives the error E(s), G(s) gives C(s), and H(s) feeds C back as B(s)</title>
