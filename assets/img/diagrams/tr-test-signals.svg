<text x="368.0" y="170.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">t</text>
<text x="236.0" y="38.0" font-size="14" text-anchor="start" fill="#0f172a" font-weight="400" font-style="italic"></text>
<path d="M230.0 150.0 L262.5 150.0 L262.5 80.0 L360.0 80.0" fill="none" stroke="#db2777" stroke-width="2.6"/>
<text x="295.0" y="182.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">r(t) = A·u(t)</text>
<text x="295.0" y="204.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">R(s) = A / s</text>
<text x="480.0" y="26.0" font-size="15" text-anchor="middle" fill="#0077b6" font-weight="600">Ramp</text>
