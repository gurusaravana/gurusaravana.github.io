<text x="480.0" y="182.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">r(t) = A·t</text>
<text x="480.0" y="204.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">R(s) = A / s<tspan baseline-shift="super" font-size="70%">2</tspan></text>
