<text x="110.0" y="182.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">r(t) = δ(t)</text>
<text x="110.0" y="204.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">R(s) = A</text>
<text x="295.0" y="26.0" font-size="15" text-anchor="middle" fill="#0077b6" font-weight="600">Step</text>
<path d="M230.0 150.0 L370.0 150.0" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ak)"/>
