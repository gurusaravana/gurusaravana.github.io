<text x="665.0" y="182.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">r(t) = A·t<tspan baseline-shift="super" font-size="70%">2</tspan> / 2</text>
<text x="665.0" y="204.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">R(s) = A / s<tspan baseline-shift="super" font-size="70%">3</tspan></text>
<path d="M110.0 232.0 L650.0 232.0" fill="none" stroke="#0077b6" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="380.0" y="252.0" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400">integrate to get the next signal  →   ·   ←  differentiate to get the previous one</text>
</g>
