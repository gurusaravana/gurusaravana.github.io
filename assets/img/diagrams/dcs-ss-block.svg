<path d="M70.0 110.0 L70.0 40.0 L300.0 40.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#am)"/>
<rect x="302.0" y="22.0" width="56.0" height="36.0" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="330.0" y="45.0" font-size="14" text-anchor="middle" fill="#64748b" font-weight="400">d</text>
<path d="M358.0 40.0 L620.0 40.0 L620.0 99.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#am)"/>
<text x="360.0" y="242.0" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">x(k+1) = F x(k) + g u(k),    y(k) = c x(k) + d u(k)</text>
</g>
</svg>
