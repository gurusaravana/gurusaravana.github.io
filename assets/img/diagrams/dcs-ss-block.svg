<rect x="302.0" y="90.0" width="56.0" height="40.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="330.0" y="115.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">z⁻¹</text>
<path d="M358.0 110.0 L480.0 110.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="420.0" y="100.0" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">x(k)</text>
