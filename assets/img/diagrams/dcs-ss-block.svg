<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="General discrete state-space model: the input u(k) passes through g into a summing junction, a unit delay z inverse produces the state x(k), F feeds the state back, c forms the output and d feeds the input straight through.">
<title>General discrete state-space model: the input u(k) passes through g into a summing junction, a unit delay z inverse produces the state x(k), F feeds the state back, c forms the output and d feeds the input straight through.</title>
