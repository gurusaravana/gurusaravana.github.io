<rect width="720" height="250" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="30.0" y="98.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">u(k)</text>
<path d="M14.0 110.0 L110.0 110.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<circle cx="70.0" cy="110.0" r="4" fill="#0f172a"/>
