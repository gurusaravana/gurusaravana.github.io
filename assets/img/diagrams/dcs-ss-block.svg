<path d="M538.0 110.0 L608.0 110.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<circle cx="620.0" cy="110.0" r="11.0" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="620.0" y="115.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400">Σ</text>
<path d="M631.0 110.0 L704.0 110.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="680.0" y="98.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">y(k)</text>
<path d="M400.0 110.0 L400.0 190.0 L360.0 190.0" fill="none" stroke="#ea7a1f" stroke-width="2" marker-end="url(#ao)"/>
