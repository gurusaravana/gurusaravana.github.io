<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Left: the control resolution is the spacing between neighbouring addressable points; a target between two points can be reached only to within half that spacing. Right: repeatability is the spread of repeated visits to a taught point, while accuracy is the distance between the commanded target and where the arm actually goes.">
<title>Left: the control resolution is the spacing between neighbouring addressable points; a target between two points can be reached only to within half that spacing. Right: repeatability is the spread of repeated visits to a taught point, while accuracy is the distance between the commanded target and where the arm actually goes.</title>
