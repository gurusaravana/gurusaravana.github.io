<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Fixed automation suits very high quantity and low product variety, programmable automation suits low to medium quantity and high variety, flexible automation sits in between.">
