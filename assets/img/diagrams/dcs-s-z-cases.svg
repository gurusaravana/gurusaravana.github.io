<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Mapping points from the s-plane to the z-plane with z = e to the sT: s = 0 goes to z = 1, a real pole s = −a goes to z = e to the −aT inside the unit circle, poles on the imaginary axis go onto the unit circle, s = ±jπ/T goes to z = −1, and complex poles in the left half go inside the circle.">
