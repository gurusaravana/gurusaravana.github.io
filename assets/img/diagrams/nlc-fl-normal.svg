<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="The normal form for relative degree rho. The external part is a chain of rho integrators from the new input v to the output y = xi_1. The internal part, eta, obeys d eta / dt = f0(eta, xi): it is driven by the output and its derivatives but does not affect them, so it cannot be seen from y. With y held at zero, it reduces to the zero dynamics">
<title>The normal form for relative degree rho. The external part is a chain of rho integrators from the new input v to the output y = xi_1. The internal part, eta, obeys d eta / dt = f0(eta, xi): it is driven by the output and its derivatives but does not affect them, so it cannot be seen from y. With y held at zero, it reduces to the zero dynamics</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="280" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<line x1="20.0" y1="70.0" x2="80.0" y2="70.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="45.0" y="60.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">v</text>
<rect x="80.0" y="44.0" width="60.0" height="52.0" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.6"/>
<text x="110.0" y="76.0" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="400">∫</text>
<line x1="140.0" y1="70.0" x2="250.0" y2="70.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="195.0" y="60.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">ξᵨ</text>
<text x="272.0" y="76.0" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="400">···</text>
<line x1="295.0" y1="70.0" x2="360.0" y2="70.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ak)"/>
<rect x="360.0" y="44.0" width="60.0" height="52.0" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.6"/>
<text x="390.0" y="76.0" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="400">∫</text>
<line x1="420.0" y1="70.0" x2="500.0" y2="70.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="460.0" y="60.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">ξ₂</text>
<rect x="500.0" y="44.0" width="60.0" height="52.0" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.6"/>
<text x="530.0" y="76.0" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="400">∫</text>
<line x1="560.0" y1="70.0" x2="740.0" y2="70.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="700.0" y="60.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">y = ξ₁</text>
<text x="300.0" y="24.0" font-size="12.5" text-anchor="middle" fill="#0077b6" font-weight="600">external part: a chain of ρ integrators from v to y</text>
<rect x="70.0" y="36.0" width="500.0" height="70.0" rx="10" fill="none" stroke="#0077b6" stroke-width="1.3" stroke-dasharray="6 4"/>
<rect x="270.0" y="160.0" width="220.0" height="60.0" rx="6" fill="#fff7ed" stroke="#ea7a1f" stroke-width="1.6"/>
<text x="380.0" y="188.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">η̇ = f₀(η, ξ)</text>
<text x="380.0" y="208.0" font-size="12" text-anchor="middle" fill="#ea7a1f" font-weight="400">internal dynamics</text>
<line x1="620.0" y1="70.0" x2="620.0" y2="190.0" stroke="#0f172a" stroke-width="1.4"/>
<line x1="620.0" y1="190.0" x2="490.0" y2="190.0" stroke="#0f172a" stroke-width="1.4" marker-end="url(#ak)"/>
<text x="630.0" y="140.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">ξ = (y, ẏ, ÿ, …)</text>
<text x="380.0" y="246.0" font-size="12" text-anchor="middle" fill="#ea7a1f" font-weight="400">η does not feed back into ξ, so it is invisible in y</text>
<text x="380.0" y="266.0" font-size="12" text-anchor="middle" fill="#ea7a1f" font-weight="400">with y ≡ 0: η̇ = f₀(η, 0), the zero dynamics</text>
</g>
</svg>
