<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" role="img" aria-label="The bilinear map w = (z − 1)/(z + 1) sends the inside of the unit circle in the z-plane to the left half of the w-plane, so the Routh-Hurwitz test can be applied.">
<title>The bilinear map w = (z − 1)/(z + 1) sends the inside of the unit circle in the z-plane to the left half of the w-plane, so the Routh-Hurwitz test can be applied.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="700" height="260" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<circle cx="140.0" cy="130.0" r="85.0" fill="#d3efe5" stroke="#059669" stroke-width="2"/>
<path d="M25.0 130.0 L255.0 130.0" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ak)"/>
<path d="M140.0 240.0 L140.0 20.0" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="253.0" y="150.0" font-size="13" text-anchor="end" fill="#64748b" font-weight="400" font-style="italic">Re z</text>
<text x="148.0" y="32.0" font-size="13" text-anchor="start" fill="#64748b" font-weight="400" font-style="italic">Im z</text>
<text x="140.0" y="18.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="700">z-plane: |z| &lt; 1</text>
<text x="229.0" y="146.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">1</text>
<text x="51.0" y="146.0" font-size="12" text-anchor="end" fill="#64748b" font-weight="400">−1</text>
<rect x="430.0" y="20.0" width="130.0" height="220.0" rx="0" fill="#059669" stroke="none" stroke-width="0" fill-opacity="0.2"/>
<path d="M560.0 20.0 L560.0 240.0" fill="none" stroke="#059669" stroke-width="2.5"/>
<path d="M435.0 130.0 L685.0 130.0" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ak)"/>
<path d="M560.0 240.0 L560.0 20.0" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="683.0" y="150.0" font-size="13" text-anchor="end" fill="#64748b" font-weight="400" font-style="italic">Re w</text>
<text x="568.0" y="32.0" font-size="13" text-anchor="start" fill="#64748b" font-weight="400" font-style="italic">Im w</text>
<text x="560.0" y="18.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="700">w-plane: Re w &lt; 0</text>
<path d="M290.0 130.0 L400.0 130.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="345.0" y="118.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">w = (z−1)/(z+1)</text>
<text x="345.0" y="152.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">z = (1+w)/(1−w)</text>
<text x="350.0" y="252.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">z = 1 → w = 0,   z = −1 → w = ∞,   unit circle → imaginary axis</text>
</g>
</svg>
