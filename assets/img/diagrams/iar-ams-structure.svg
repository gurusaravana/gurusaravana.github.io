<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="An automated manufacturing system: a cell or supervisory computer is linked to CNC machining centres, assembly stations, inspection machines, robots, automated guided vehicles, conveyors and automated storage; sensors send data back.">
