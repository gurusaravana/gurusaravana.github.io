<text x="120.0" y="176.2" font-size="14" text-anchor="middle" fill="#ea7a1f" font-weight="600">Industrial</text>
<text x="120.0" y="193.7" font-size="14" text-anchor="middle" fill="#ea7a1f" font-weight="400">robots</text>
