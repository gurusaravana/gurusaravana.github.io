<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="A rod pendulum driven by a motor torque T at the pivot. Gravity Mg acts at the centre of mass, a distance l/2 from the pivot, and gives the moment −Mg (l/2) sin θ. Left: the hanging operating point θ = 0. Right: the inverted operating point θ = π, where the small deviation is δθ = θ − π, measured from the upward vertical">
