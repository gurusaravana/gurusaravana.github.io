<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Polar plot of G(jω) = 10/(jω(jω+1)(jω+2)) (blue) and the critical locus −1/K_N(X) of an ideal relay with M = 1 (pink), which runs along the negative real axis from 0 to minus infinity as X grows. They cross at −1.667 when ω = √2, predicting a limit cycle of amplitude X = 2.12 and period 4.44 s">
<title>Polar plot of G(jω) = 10/(jω(jω+1)(jω+2)) (blue) and the critical locus −1/K_N(X) of an ideal relay with M = 1 (pink), which runs along the negative real axis from 0 to minus infinity as X grows. They cross at −1.667 when ω = √2, predicting a limit cycle of amplitude X = 2.12 and period 4.44 s</title>
