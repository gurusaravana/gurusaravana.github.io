<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" width="620" height="210" role="img" aria-label="Unity feedback loop whose closed-loop transfer function is the standard second-order system">
<title>Unity feedback loop whose closed-loop transfer function is the standard second-order system</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker></defs>
<rect width="620" height="210" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="30" y="85" font-size="15" text-anchor="middle" fill="#db2777" font-weight="600">R(s)</text>
<path d="M60.0 80.0 L126.0 80.0" fill="none" stroke="#0f172a" stroke-width="2.2" marker-end="url(#ab)"/>
<circle cx="140" cy="80" r="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<path d="M130.2 70.2L149.8 89.8M130.2 89.8L149.8 70.2" stroke="#0f172a" stroke-width="1.4"/>
<text x="120" y="70" font-size="15" text-anchor="middle" fill="#db2777" font-weight="600">+</text>
<text x="152" y="114" font-size="15" text-anchor="middle" fill="#db2777" font-weight="600">−</text>
<path d="M154.0 80.0 L230.0 80.0" fill="none" stroke="#0f172a" stroke-width="2.2" marker-end="url(#ab)"/>
<rect x="230.0" y="45.0" width="180" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="320" y="72" font-size="15" text-anchor="middle" fill="#0f172a">ωₙ²</text>
<path d="M273.2 78.0H366.8" stroke="#0f172a" stroke-width="1.4"/>
<text x="320" y="95" font-size="15" text-anchor="middle" fill="#0f172a">s (s + 2ζωₙ)</text>
<path d="M410.0 80.0 L540.0 80.0" fill="none" stroke="#0f172a" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="570" y="85" font-size="15" text-anchor="middle" fill="#db2777" font-weight="600">C(s)</text>
<circle cx="480" cy="80" r="3.6" fill="#0f172a"/>
<path d="M480.0 80.0 L480.0 170.0 L140.0 170.0 L140.0 94.0" fill="none" stroke="#0f172a" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="310" y="200" font-size="13" text-anchor="middle" fill="#475569">C(s)/R(s) = ωₙ² / (s² + 2ζωₙ s + ωₙ²)   ·   RLC: ωₙ = 1/√(LC),  ζ = (R/2)√(C/L)</text>
</g>
</svg>
