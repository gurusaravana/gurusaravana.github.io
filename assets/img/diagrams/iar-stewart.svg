<text x="380.0" y="48.0" font-size="13" text-anchor="middle" fill="#db2777" font-weight="700">moving platform</text>
<text x="380.0" y="342.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="700">fixed base</text>
<text x="40.0" y="150.0" font-size="13" text-anchor="start" fill="#0f172a" font-weight="700">each leg:</text>
<text x="40.0" y="170.0" font-size="12" text-anchor="start" fill="#ea7a1f" font-weight="600">U joint at the base (2 dof)</text>
<text x="40.0" y="188.0" font-size="12" text-anchor="start" fill="#0077b6" font-weight="600">P joint, powered (1 dof)</text>
<text x="40.0" y="206.0" font-size="12" text-anchor="start" fill="#059669" font-weight="600">S joint at the top (3 dof)</text>
<text x="610.0" y="150.0" font-size="13" text-anchor="start" fill="#0f172a" font-weight="700">N = 14, J = 18</text>
<text x="610.0" y="170.0" font-size="12" text-anchor="start" fill="#0f172a" font-weight="400">dof = 6(14 − 1 − 18)</text>
<text x="610.0" y="188.0" font-size="12" text-anchor="start" fill="#0f172a" font-weight="400">  + 6·2 + 6·1 + 6·3 = 6</text>
