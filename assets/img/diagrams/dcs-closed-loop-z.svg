<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-label="Digital closed loop in the z-domain: R(z) minus Y(z) gives the error E(z), the digital controller C(z) gives U(z), and the DAC, plant and ADC cascade G_ZAS(z) gives the output Y(z), fed back with unity gain.">
<title>Digital closed loop in the z-domain: R(z) minus Y(z) gives the error E(z), the digital controller C(z) gives U(z), and the DAC, plant and ADC cascade G_ZAS(z) gives the output Y(z), fed back with unity gain.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="720" height="190" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="40.0" y="58.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">R(z)</text>
<path d="M14.0 70.0 L98.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<circle cx="112.0" cy="70.0" r="13.0" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<path d="M102.9 60.9L121.1 79.1M102.9 79.1L121.1 60.9" stroke="#0f172a" stroke-width="1.3"/>
<text x="91.0" y="63.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">+</text>
<text x="126.0" y="96.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">−</text>
<path d="M125.0 70.0 L218.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="172.0" y="58.0" font-size="14" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">E(z)</text>
<rect x="218.0" y="47.0" width="104.0" height="46.0" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="270.0" y="75.0" font-size="15" text-anchor="middle" fill="#059669" font-weight="400">C(z)</text>
<path d="M322.0 70.0 L418.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="370.0" y="58.0" font-size="14" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">U(z)</text>
<rect x="418.0" y="47.0" width="124.0" height="46.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="480.0" y="75.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">G_ZAS(z)</text>
<path d="M542.0 70.0 L704.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="668.0" y="58.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">Y(z)</text>
<circle cx="620.0" cy="70.0" r="4" fill="#0f172a"/>
<path d="M620.0 70.0 L620.0 150.0 L112.0 150.0 L112.0 83.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<text x="270.0" y="112.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">digital controller</text>
<text x="480.0" y="112.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">DAC + plant + ADC</text>
</g>
</svg>
