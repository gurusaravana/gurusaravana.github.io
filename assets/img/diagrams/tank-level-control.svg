<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Closed-loop water level control: level transmitter LT measures the level, controller LC compares it with the setpoint and moves the inlet control valve">
<title>Closed-loop water level control: level transmitter LT measures the level, controller LC compares it with the setpoint and moves the inlet control valve</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#475569" stroke-width="1.5"/></pattern></defs>
<rect width="600" height="320" fill="#ffffff"/>
<g fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" font-family="Inter, Arial, sans-serif">
<rect x="231" y="175" width="168" height="94" fill="#7dd3fc" stroke="none" opacity=".8"/><path d="M230 100V270H400V100"/><path d="M232 175q14 -6 28 0t28 0t28 0t28 0t28 0t28 0" stroke="#0284c7" stroke-width="1.6"/><path d="M30 70H118 M142 70H300V100"/><path d="M118 58L142 82V58L118 82Z" fill="#fff"/><path d="M130 70V44 M116 44a14 14 0 0 1 28 0Z" fill="#e0e7ff" stroke="#4f46e5"/><path d="M40 60H90" stroke="#4f46e5" marker-end="url(#ai)"/><text x="30" y="98" fill="#475569" stroke="none" font-size="13" text-anchor="start" font-weight="400">inflow</text>
<path d="M400 250H500 M524 250H580"/><path d="M500 238L524 262V238L500 262Z" fill="#fff"/><text x="560" y="280" fill="#475569" stroke="none" font-size="13" text-anchor="end" font-weight="400">outflow (demand)</text>
<path d="M400 190H450"/><circle cx="472" cy="190" r="22" fill="#fff" stroke="#4f46e5"/><text x="472" y="196" fill="#4f46e5" stroke="none" font-size="14" text-anchor="middle" font-weight="600">LT</text>
<circle cx="472" cy="100" r="22" fill="#fff" stroke="#4f46e5"/><text x="472" y="106" fill="#4f46e5" stroke="none" font-size="14" text-anchor="middle" font-weight="600">LC</text>
<path d="M472 168V122" stroke="#4f46e5" stroke-dasharray="6 5" marker-end="url(#ai)"/><path d="M472 78V22H130V30" stroke="#4f46e5" stroke-dasharray="6 5" marker-end="url(#ai)"/><path d="M570 100H497" stroke="#db2777" marker-end="url(#ar)"/><text x="575" y="92" fill="#db2777" stroke="none" font-size="13" text-anchor="end" font-weight="500">setpoint</text>
<text x="315" y="230" fill="#075985" stroke="none" font-size="14" text-anchor="middle" font-weight="500" font-style="italic">level h(t)</text>
<text x="152" y="52" fill="#475569" stroke="none" font-size="13" text-anchor="start" font-weight="400">control valve</text>
<text x="300" y="306" fill="#475569" stroke="none" font-size="13" text-anchor="middle" font-weight="400">Measure (LT) → compare and decide (LC) → act (valve) → process (tank)</text>
</g></svg>
