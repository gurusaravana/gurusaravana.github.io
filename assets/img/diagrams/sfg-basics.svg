<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="The same relation drawn two ways: a block G(s) between R(s) and C(s), and a signal flow graph with nodes R(s) and C(s) joined by a branch of gain G(s)">
<title>The same relation drawn two ways: a block G(s) between R(s) and C(s), and a signal flow graph with nodes R(s) and C(s) joined by a branch of gain G(s)</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="760" height="190" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="170" y="26" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">Block diagram</text>
<path d="M40.0 80.0 L118.0 80.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="120.0" y="57.0" width="100.0" height="46" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="170" y="85.6" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="400">G(s)</text>
<path d="M220.0 80.0 L300.0 80.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="70" y="68" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">R(s)</text>
<text x="275" y="68" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">C(s)</text>
<text x="170" y="165.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">redrawn after every reduction step</text>
<path d="M380 20 L380 155" stroke="#e2e8f0" stroke-width="2"/>
<text x="570" y="26" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">Signal flow graph</text>
<circle cx="460" cy="80" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="460" y="66" font-size="15" text-anchor="middle" fill="#db2777" font-weight="600">R(s)</text>
<text x="460" y="104" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400">node</text>
<circle cx="680" cy="80" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="680" y="66" font-size="15" text-anchor="middle" fill="#db2777" font-weight="600">C(s)</text>
<text x="680" y="104" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400">node</text>
<path d="M467.0 80.0 Q518.5 80.0 570.0 80.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<path d="M570.0 80.0 Q621.5 80.0 673.0 80.0" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="570.0" y="61.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">G(s)</text>
<text x="570" y="128" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">branch with gain (transmittance) G(s)</text>
<text x="570" y="165.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">drawn once, then Mason&#x27;s gain formula</text>
</g>
</svg>
