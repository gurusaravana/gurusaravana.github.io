<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="680" height="210" role="img" aria-label="Unity feedback loop with a PID controller and the plant 1 over s squared plus 10 s plus 20">
<title>Unity feedback loop with a PID controller and the plant 1 over s squared plus 10 s plus 20</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker></defs>
<rect width="680" height="210" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="30" y="85" font-size="15" text-anchor="middle" fill="#db2777" font-weight="600">R(s)</text>
