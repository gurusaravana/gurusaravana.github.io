<text x="340" y="200" font-size="13" text-anchor="middle" fill="#475569">Set Kᵢ = 0 and K<tspan dy="4" font-size="9">d</tspan><tspan dy="-4">​</tspan> = 0 for P control, Kᵢ = 0 for PD, K<tspan dy="4" font-size="9">d</tspan><tspan dy="-4">​</tspan> = 0 for PI</text>
