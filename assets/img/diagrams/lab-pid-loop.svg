<text x="152" y="114" font-size="15" text-anchor="middle" fill="#db2777" font-weight="600">−</text>
<path d="M154.0 80.0 L210.0 80.0" fill="none" stroke="#0f172a" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="182" y="70" font-size="14" text-anchor="middle" fill="#db2777">E</text>
