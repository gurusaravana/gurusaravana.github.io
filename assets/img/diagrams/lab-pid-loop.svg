<text x="300" y="85.0" font-size="14" text-anchor="middle" fill="#0f172a">Gc(s) = Kₚ + Kᵢ/s + K<tspan dy="4" font-size="10">d</tspan><tspan dy="-4">​</tspan> s</text>
<path d="M390.0 80.0 L440.0 80.0" fill="none" stroke="#0f172a" stroke-width="2.2" marker-end="url(#ab)"/>
