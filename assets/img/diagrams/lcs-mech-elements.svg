<text x="650.0" y="175.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">f = M ẍ</text>
<text x="650.0" y="205.0" font-size="15" text-anchor="middle" fill="#64748b" font-weight="400">Z(s) = Ms²</text>
<text x="390.0" y="238.0" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400">In the s-domain every element obeys F(s) = Z(s)·X(s), just as V = Z·I in a circuit</text>
