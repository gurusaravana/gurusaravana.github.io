<text x="300.0" y="60.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">x₁</text>
<path d="M440.0 70.0 L480.0 70.0" fill="none" stroke="#db2777" stroke-width="2" marker-end="url(#ap)"/>
<text x="480.0" y="60.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">x₂</text>
<text x="390.0" y="160.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">f = B(ẋ₁ − ẋ₂)</text>
<text x="390.0" y="190.0" font-size="15" text-anchor="middle" fill="#64748b" font-weight="400">Z(s) = Bs</text>
