<text x="130.0" y="190.0" font-size="15" text-anchor="middle" fill="#64748b" font-weight="400">Z(s) = K</text>
<text x="390.0" y="28.0" font-size="16" text-anchor="middle" fill="#0077b6" font-weight="700">Viscous damper</text>
<path d="M300.0 100.0 L368.4 100.0" fill="none" stroke="#0077b6" stroke-width="2"/>
