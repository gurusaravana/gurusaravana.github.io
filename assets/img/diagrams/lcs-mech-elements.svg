<path d="M40.0 100.0 L72.4 100.0 L77.2 108.0 L86.8 92.0 L96.4 108.0 L106.0 92.0 L115.6 108.0 L125.2 92.0 L134.8 108.0 L144.4 92.0 L154.0 108.0 L163.6 92.0 L173.2 108.0 L182.8 92.0 L187.6 100.0 L220.0 100.0" fill="none" stroke="#0077b6" stroke-width="2"/>
