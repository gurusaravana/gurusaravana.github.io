<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Anatomy of a process control loop: the setpoint r and the measurement b meet at the error detector, giving e = r minus b. The controller turns e into the output p, which drives the final control element (a valve) acting on the process. A disturbance (load change) also acts on the process. A sensor and transmitter measure the controlled variable and send b back.">
<title>Anatomy of a process control loop: the setpoint r and the measurement b meet at the error detector, giving e = r minus b. The controller turns e into the output p, which drives the final control element (a valve) acting on the process. A disturbance (load change) also acts on the process. A sensor and transmitter measure the controlled variable and send b back.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="760" height="230" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="14.0" y="76.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">r</text>
<text x="60.0" y="76.0" font-size="12" text-anchor="middle" fill="#db2777" font-weight="400">setpoint</text>
<path d="M24.0 85.0 L106.0 85.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<circle cx="120.0" cy="85.0" r="13" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<path d="M110.9 75.9L129.1 94.1M110.9 94.1L129.1 75.9" stroke="#0f172a" stroke-width="1.3"/>
<text x="99.0" y="78.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">+</text>
<text x="133.0" y="111.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">−</text>
<text x="120.0" y="52.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">error detector</text>
<path d="M134.0 85.0 L200.0 85.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="167.0" y="74.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">e</text>
<rect x="202.0" y="60.0" width="96.0" height="50.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="250.0" y="89.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">Controller</text>
<path d="M298.0 85.0 L360.0 85.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="329.0" y="74.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">p</text>
<rect x="362.0" y="60.0" width="126.0" height="50.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="425.0" y="89.5" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400">Final control</text>
<text x="425.0" y="125.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">element (valve)</text>
<path d="M488.0 85.0 L560.0 85.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="562.0" y="60.0" width="96.0" height="50.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="610.0" y="89.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">Process</text>
<path d="M610.0 30.0 L610.0 58.0" fill="none" stroke="#ea7a1f" stroke-width="2" marker-end="url(#ao)"/>
<text x="610.0" y="22.0" font-size="12.5" text-anchor="middle" fill="#ea7a1f" font-weight="400">disturbance (load change)</text>
<path d="M658.0 85.0 L740.0 85.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="712.0" y="72.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">c</text>
<circle cx="690.0" cy="85.0" r="4" fill="#0f172a"/>
<path d="M690.0 85.0 L690.0 185.0 L495.0 185.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<rect x="345.0" y="165.0" width="150.0" height="40.0" rx="4" fill="#fff" stroke="#0077b6" stroke-width="2"/>
<text x="420.0" y="189.4" font-size="12.5" text-anchor="middle" fill="#0077b6" font-weight="400">Sensor / transmitter</text>
<path d="M345.0 185.0 L120.0 185.0 L120.0 99.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<text x="240.0" y="176.0" font-size="13" text-anchor="middle" fill="#0077b6" font-weight="400">measurement b</text>
<text x="150.0" y="216.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">e = r − b</text>
</g>
</svg>
