<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" width="760" height="415" role="img" aria-label="Electronic PI controller built from three op-amp stages. The error voltage Ve feeds an inverting amplifier (R1, Rp) giving Vp = minus Rp over R1 times Ve, and an integrator (Ri, Ci) giving Vi = minus 1 over Ri Ci times the integral of Ve. A summing amplifier (Rs1, Rs2, Rf) adds them, so Vout = (Rf/Rs1)(Rp/R1) Ve + (Rf/Rs2)(1/RiCi) integral of Ve dt.">
<title>Electronic PI controller built from three op-amp stages. The error voltage Ve feeds an inverting amplifier (R1, Rp) giving Vp = minus Rp over R1 times Ve, and an integrator (Ri, Ci) giving Vi = minus 1 over Ri Ci times the integral of Ve. A summing amplifier (Rs1, Rs2, Rf) adds them, so Vout = (Rf/Rs1)(Rp/R1) Ve + (Rf/Rs2)(1/RiCi) integral of Ve dt.</title>
