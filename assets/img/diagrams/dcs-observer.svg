<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Prediction observer: a copy of the plant model F, g, c runs alongside the plant; the difference between the measured output y(k) and the predicted output ŷ(k) is fed back through the observer gain m to correct the estimate.">
