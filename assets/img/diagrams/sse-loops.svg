<rect x="531.0" y="48.0" width="78.0" height="44.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="570.0" y="75.6" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="400">G(s)</text>
<path d="M609.0 70.0 L700.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="682.0" y="58.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">C(s)</text>
<circle cx="655.0" cy="70.0" r="4" fill="#0f172a"/>
<path d="M655.0 70.0 L655.0 135.0 L609.0 135.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<rect x="531.0" y="115.0" width="78.0" height="40.0" rx="4" fill="#fff" stroke="#0077b6" stroke-width="2"/>
<text x="570.0" y="140.6" font-size="16" text-anchor="middle" fill="#0077b6" font-weight="400">H(s)</text>
<path d="M531.0 135.0 L460.0 135.0 L460.0 82.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<text x="545.0" y="180.0" font-size="13.5" text-anchor="middle" fill="#0f172a" font-weight="400">Non-unity: use E(s) = R(s)[1 − T(s)]</text>
</g>
</svg>
