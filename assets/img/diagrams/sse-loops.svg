<text x="175.0" y="180.0" font-size="13.5" text-anchor="middle" fill="#0f172a" font-weight="400">Unity feedback: E(s) = R(s) − C(s)</text>
<text x="400.0" y="58.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">R(s)</text>
