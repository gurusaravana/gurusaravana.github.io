<circle cx="460.0" cy="70.0" r="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<path d="M451.6 61.6L468.4 78.4M451.6 78.4L468.4 61.6" stroke="#0f172a" stroke-width="1.3"/>
<text x="440.0" y="63.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">+</text>
<text x="472.0" y="95.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">−</text>
