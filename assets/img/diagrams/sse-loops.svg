<text x="30.0" y="58.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">R(s)</text>
<path d="M15.0 70.0 L76.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<circle cx="90.0" cy="70.0" r="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<path d="M81.6 61.6L98.4 78.4M81.6 78.4L98.4 61.6" stroke="#0f172a" stroke-width="1.3"/>
<text x="70.0" y="63.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">+</text>
<text x="102.0" y="95.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">−</text>
