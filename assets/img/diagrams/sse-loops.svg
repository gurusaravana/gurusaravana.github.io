<text x="200.0" y="75.6" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="400">G(s)</text>
<path d="M239.0 70.0 L330.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="312.0" y="58.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">C(s)</text>
