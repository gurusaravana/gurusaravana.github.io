<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="Automation hierarchy in a large plant, from level 0 field sensors and actuators up to level 5 enterprise and administration. Response time gets slower and data are condensed going up.">
<title>Automation hierarchy in a large plant, from level 0 field sensors and actuators up to level 5 enterprise and administration. Response time gets slower and data are condensed going up.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs>
<rect width="800" height="430" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<path d="M185.0 30.0 L435.0 30.0 L464.0 84.0 L156.0 84.0 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="310.0" y="54.0" font-size="14" text-anchor="middle" fill="#7c3aed" font-weight="700">5 · Enterprise and administration</text>
<text x="310.0" y="72.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="400">ERP: planning, orders, finance, statistics</text>
<path d="M156.0 88.0 L464.0 88.0 L493.0 142.0 L127.0 142.0 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="310.0" y="112.0" font-size="14" text-anchor="middle" fill="#7c3aed" font-weight="700">4 · Manufacturing execution</text>
<text x="310.0" y="130.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="400">MES: workflow, order tracking, resources, quality</text>
<path d="M127.0 146.0 L493.0 146.0 L522.0 200.0 L98.0 200.0 Z" fill="#e0f2fe" stroke="#0077b6" stroke-width="2"/>
<text x="310.0" y="170.0" font-size="14" text-anchor="middle" fill="#0077b6" font-weight="700">3 · Supervisory</text>
<text x="310.0" y="188.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="400">SCADA: operator screens, alarms, trends, history</text>
<path d="M98.0 204.0 L522.0 204.0 L551.0 258.0 L69.0 258.0 Z" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="310.0" y="228.0" font-size="14" text-anchor="middle" fill="#059669" font-weight="700">2 · Group (area) control</text>
<text x="310.0" y="246.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="400">coordinates several units, set-points (DCS)</text>
<path d="M69.0 262.0 L551.0 262.0 L580.0 316.0 L40.0 316.0 Z" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="310.0" y="286.0" font-size="14" text-anchor="middle" fill="#059669" font-weight="700">1 · Unit (cell) control</text>
<text x="310.0" y="304.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="400">PLC / controller: measure, regulate, interlock</text>
<path d="M40.0 320.0 L580.0 320.0 L609.0 374.0 L11.0 374.0 Z" fill="#ffedd5" stroke="#ea7a1f" stroke-width="2"/>
<text x="310.0" y="344.0" font-size="14" text-anchor="middle" fill="#ea7a1f" font-weight="700">0 · Field</text>
<text x="310.0" y="362.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="400">sensors and actuators on the plant</text>
<path d="M670.0 380.0 L670.0 50.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<text x="685.0" y="120.0" font-size="13" text-anchor="start" fill="#0077b6" font-weight="600">slower</text>
<text x="685.0" y="137.0" font-size="13" text-anchor="start" fill="#0077b6" font-weight="400">response</text>
<text x="685.0" y="154.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">(days, months)</text>
<text x="685.0" y="300.0" font-size="13" text-anchor="start" fill="#0077b6" font-weight="600">faster</text>
<text x="685.0" y="317.0" font-size="13" text-anchor="start" fill="#0077b6" font-weight="400">response</text>
<text x="685.0" y="334.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">(milliseconds)</text>
<text x="640.0" y="405.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">more raw data at the bottom,</text>
<text x="640.0" y="421.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400">condensed information at the top</text>
</g>
</svg>
