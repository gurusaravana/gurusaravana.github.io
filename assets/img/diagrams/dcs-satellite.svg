<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-label="Satellite attitude loop with state feedback: the control u(k) passes through a zero-order hold into two integrators giving the angular velocity x2 and the angle x1; both states are sampled and fed back through gains k2 and k1, and u(k) = −k1 x1(k) − k2 x2(k).">
