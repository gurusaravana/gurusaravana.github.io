<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-label="Tools for studying an automated manufacturing system: performance measurement on an existing system, or performance modelling by discrete event simulation or by analytical models such as Markov chains, queues, queueing networks, Petri nets and min-max algebra.">
<title>Tools for studying an automated manufacturing system: performance measurement on an existing system, or performance modelling by discrete event simulation or by analytical models such as Markov chains, queues, queueing networks, Petri nets and min-max algebra.</title>
