<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="G(j omega) = 2 minus j over omega drawn as a vector in the complex plane: at omega = 0.5 it ends at 2 minus j2, so its length is 2.83 and its angle minus 45 degrees; as omega grows the tip slides up the vertical line Re = 2 to the point 2, and as omega falls it runs down to minus infinity">
<title>G(j omega) = 2 minus j over omega drawn as a vector in the complex plane: at omega = 0.5 it ends at 2 minus j2, so its length is 2.83 and its angle minus 45 degrees; as omega grows the tip slides up the vertical line Re = 2 to the point 2, and as omega falls it runs down to minus infinity</title>
