<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="The primary strip of the s-plane, between −π/T and +π/T, maps onto the whole z-plane: the left half (A) goes inside the unit circle, the imaginary axis (B) onto the circle, and the right half (C) outside. Strips above and below are alias strips that map onto the same z-plane again.">
