<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Gripper types: an external gripper closes its fingers on the outside of a part, an internal gripper expands inside a hole, a vacuum cup holds flat thin parts by suction and a magnetic gripper holds ferrous parts.">
