<path d="M460 235H510 M534 235H600" /><path d="M510 225L534 245V225L510 245Z" fill="#fff"/><text x="560" y="268" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="middle">R₂, outflow q₂</text>
<path d="M20 60H60 M84 60H165V90"/><path d="M60 48L84 72V48L60 72Z" fill="#fff"/><path d="M72 60V40 M58 40a14 14 0 0 1 28 0Z" fill="#e0e7ff" stroke="#4f46e5"/><text x="20" y="84" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="start">inflow qᵢ</text>
<text x="165" y="196" fill="#075985" stroke="none" font-size="14" text-anchor="middle" font-style="italic" font-weight="500">h₁, A₁</text><text x="395" y="216" fill="#075985" stroke="none" font-size="14" text-anchor="middle" font-style="italic" font-weight="500">h₂, A₂</text>
<text x="165" y="120" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="middle">tank 1</text><text x="395" y="120" fill="#475569" stroke="none" font-size="13" font-weight="400" text-anchor="middle">tank 2</text>
<path d="M460 190H500"/><circle cx="522" cy="190" r="20" fill="#fff" stroke="#4f46e5"/><text x="522" y="195" fill="#4f46e5" stroke="none" font-size="13" text-anchor="middle" font-weight="600">LT</text>
<circle cx="522" cy="80" r="20" fill="#fff" stroke="#4f46e5"/><text x="522" y="85" fill="#4f46e5" stroke="none" font-size="13" text-anchor="middle" font-weight="600">LC</text>
<path d="M522 170V102" stroke="#4f46e5" stroke-dasharray="6 5" marker-end="url(#ai)"/><path d="M522 60V22H72V28" stroke="#4f46e5" stroke-dasharray="6 5" marker-end="url(#ai)"/>
