<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Two interacting tanks: inflow qi enters tank 1 (area A1, level h1); a pipe with resistance R1 carries flow q1 to tank 2 (area A2, level h2); tank 2 drains through resistance R2 as flow q2. A level transmitter on tank 2 feeds the level controller, which sets the inflow valve.">
<title>Two interacting tanks: inflow qi enters tank 1 (area A1, level h1); a pipe with resistance R1 carries flow q1 to tank 2 (area A2, level h2); tank 2 drains through resistance R2 as flow q2. A level transmitter on tank 2 feeds the level controller, which sets the inflow valve.</title>
