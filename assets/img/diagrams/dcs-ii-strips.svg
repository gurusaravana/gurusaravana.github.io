<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Impulse invariance: a pole at s = −a is replicated every 2π/T up and down the s-plane by sampling; every copy maps to the same z-plane pole e^−aT. Frequency content outside the primary strip folds back as aliasing.">
