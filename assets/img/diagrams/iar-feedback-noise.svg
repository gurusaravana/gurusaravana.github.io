<text x="705.0" y="105.0" font-size="14" text-anchor="start" fill="#0f172a" font-weight="700">Y(s)</text>
<path d="M620.0 100.0 L620.0 190.0 L480.0 190.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="370.0" y="166.0" width="110.0" height="48.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="425.0" y="194.9" font-size="14" text-anchor="middle" fill="#059669" font-weight="600">sensor</text>
<circle cx="270.0" cy="190.0" r="14.0" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
<text x="270.0" y="195.0" font-size="13" text-anchor="middle" fill="#db2777" font-weight="700">+</text>
