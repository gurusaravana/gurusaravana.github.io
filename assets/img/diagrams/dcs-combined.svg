<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Observer-based control: the plant output y(k) drives the observer, the observer produces the estimate x̂(k), and the control law u(k) = −k x̂(k) closes the loop. Observer and control law together form a dynamic compensator.">
<title>Observer-based control: the plant output y(k) drives the observer, the observer produces the estimate x̂(k), and the control law u(k) = −k x̂(k) closes the loop. Observer and control law together form a dynamic compensator.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="720" height="280" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<path d="M80.0 50.0 L220.0 50.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="110.0" y="38.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">u(k)</text>
<rect x="222.0" y="30.0" width="176.0" height="40.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="310.0" y="55.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400">x(k+1) = F x + g u</text>
<text x="310.0" y="20.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">plant</text>
<path d="M398.0 50.0 L470.0 50.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="470.0" y="32.0" width="52.0" height="36.0" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="496.0" y="55.0" font-size="15" text-anchor="middle" fill="#059669" font-weight="400">c</text>
<path d="M522.0 50.0 L704.0 50.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="684.0" y="38.0" font-size="14" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">y(k)</text>
<circle cx="620.0" cy="50.0" r="4" fill="#0f172a"/>
<rect x="60.0" y="96.0" width="600.0" height="172.0" rx="6" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="360.0" y="258.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">compensator</text>
<rect x="335.0" y="142.0" width="210.0" height="56.0" rx="4" fill="#fff" stroke="#0077b6" stroke-width="2"/>
<text x="440.0" y="167.0" font-size="13" text-anchor="middle" fill="#0077b6" font-weight="400">x̂(k+1) = F x̂ + g u</text>
<text x="440.0" y="183.0" font-size="13" text-anchor="middle" fill="#0077b6" font-weight="400"> + m[y − c x̂]</text>
<text x="440.0" y="216.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">observer</text>
<path d="M620.0 50.0 L620.0 170.0 L546.0 170.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<circle cx="150.0" cy="50.0" r="4" fill="#0f172a"/>
<path d="M150.0 50.0 L150.0 120.0 L440.0 120.0 L440.0 141.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<path d="M334.0 170.0 L240.0 170.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="288.0" y="160.0" font-size="13" text-anchor="middle" fill="#0077b6" font-weight="400" font-style="italic">x̂(k)</text>
<rect x="181.0" y="150.0" width="58.0" height="40.0" rx="4" fill="#fff" stroke="#ea7a1f" stroke-width="2"/>
<text x="210.0" y="175.0" font-size="15" text-anchor="middle" fill="#ea7a1f" font-weight="400">−k</text>
<text x="210.0" y="208.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">control law</text>
<path d="M181.0 170.0 L80.0 170.0 L80.0 50.0" fill="none" stroke="#ea7a1f" stroke-width="2"/>
</g>
</svg>
