<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Impulse response of the zero-order hold: an impulse at time kT produces a pulse of height 1 and width T, which equals a positive unit step at kT plus a negative unit step delayed by T.">
<title>Impulse response of the zero-order hold: an impulse at time kT produces a pulse of height 1 and width T, which equals a positive unit step at kT plus a negative unit step delayed by T.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="760" height="250" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="130.0" y="22.0" font-size="13" text-anchor="middle" fill="#0077b6" font-weight="700">impulse in</text>
<path d="M30.0 160.0 L230.0 160.0" fill="none" stroke="#64748b" stroke-width="1.2"/>
<path d="M110.0 160.0 L110.0 60.0" fill="none" stroke="#0077b6" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="110.0" y="182.0" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">kT</text>
<path d="M236.0 120.0 L276.0 120.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="280.0" y="96.0" width="92.0" height="48.0" rx="4" fill="#fff" stroke="#ea7a1f" stroke-width="2"/>
<text x="326.0" y="125.0" font-size="15" text-anchor="middle" fill="#ea7a1f" font-weight="400">ZOH</text>
<path d="M372.0 120.0 L412.0 120.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="520.0" y="22.0" font-size="13" text-anchor="middle" fill="#ea7a1f" font-weight="700">pulse out = step − delayed step</text>
<path d="M420.0 160.0 L740.0 160.0" fill="none" stroke="#64748b" stroke-width="1.2"/>
<path d="M470.0 160.0 L470.0 70.0 L580.0 70.0 L580.0 160.0" fill="none" stroke="#ea7a1f" stroke-width="2.6"/>
<text x="470.0" y="182.0" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">kT</text>
<text x="586.0" y="182.0" font-size="13" text-anchor="start" fill="#64748b" font-weight="400" font-style="italic">(k+1)T</text>
<text x="462.0" y="74.0" font-size="13" text-anchor="end" fill="#64748b" font-weight="400">1</text>
<path d="M470.0 64.0 L740.0 64.0" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="735.0" y="56.0" font-size="12" text-anchor="end" fill="#059669" font-weight="400">+1(t − kT)</text>
<path d="M580.0 200.0 L740.0 200.0" fill="none" stroke="#db2777" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M580.0 160.0 L580.0 200.0" fill="none" stroke="#db2777" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="735.0" y="220.0" font-size="12" text-anchor="end" fill="#db2777" font-weight="400">−1(t − (k+1)T)</text>
<text x="200.0" y="236.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400" font-style="italic">G_ZOH(s) = (1 − e^(−sT)) / s</text>
</g>
</svg>
