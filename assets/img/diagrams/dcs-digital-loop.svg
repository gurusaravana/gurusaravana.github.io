<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Digital control loop: reference input to a computer, then a DAC, the actuator and process, giving the controlled variable; a sensor and an ADC close the loop back to the computer.">
<title>Digital control loop: reference input to a computer, then a DAC, the actuator and process, giving the controlled variable; a sensor and an ADC close the loop back to the computer.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="720" height="250" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="46.0" y="66.0" font-size="13" text-anchor="middle" fill="#db2777" font-weight="400">Reference</text>
<text x="46.0" y="110.0" font-size="13" text-anchor="middle" fill="#db2777" font-weight="400">input</text>
<path d="M14.0 80.0 L96.0 80.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="96.0" y="55.0" width="108.0" height="50.0" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="150.0" y="85.0" font-size="15" text-anchor="middle" fill="#059669" font-weight="400">Computer</text>
<path d="M204.0 80.0 L262.0 80.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="233.0" y="70.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">u(k)</text>
<rect x="262.0" y="58.0" width="76.0" height="44.0" rx="4" fill="#fff" stroke="#ea7a1f" stroke-width="2"/>
<text x="300.0" y="85.0" font-size="15" text-anchor="middle" fill="#ea7a1f" font-weight="400">DAC</text>
<path d="M338.0 80.0 L396.0 80.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="367.0" y="70.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">u(t)</text>
<rect x="396.0" y="52.0" width="140.0" height="56.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="466.0" y="76.5" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">Actuator</text>
<text x="466.0" y="93.5" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="400">and process</text>
<path d="M536.0 80.0 L704.0 80.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="650.0" y="66.0" font-size="13" text-anchor="middle" fill="#db2777" font-weight="400">Controlled</text>
<text x="650.0" y="108.0" font-size="13" text-anchor="middle" fill="#db2777" font-weight="400">variable</text>
<circle cx="600.0" cy="80.0" r="4" fill="#0f172a"/>
<path d="M600.0 80.0 L600.0 190.0 L520.0 190.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<rect x="420.0" y="170.0" width="100.0" height="40.0" rx="4" fill="#fff" stroke="#0077b6" stroke-width="2"/>
<text x="470.0" y="195.0" font-size="14" text-anchor="middle" fill="#0077b6" font-weight="400">Sensor</text>
<path d="M420.0 190.0 L338.0 190.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<rect x="262.0" y="170.0" width="76.0" height="40.0" rx="4" fill="#fff" stroke="#ea7a1f" stroke-width="2"/>
<text x="300.0" y="195.0" font-size="14" text-anchor="middle" fill="#ea7a1f" font-weight="400">ADC</text>
<path d="M262.0 190.0 L150.0 190.0 L150.0 105.0" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#ab)"/>
<text x="206.0" y="182.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">y(k)</text>
<text x="360.0" y="242.0" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-style="italic">Inside the computer the signals are number sequences; the plant still runs in continuous time</text>
</g>
</svg>
