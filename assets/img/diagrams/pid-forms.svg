<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Two ways to build a PID controller. Parallel (ideal or ISA) form: P, I and D paths act side by side on the error and are added. Series (interacting) form: a PI block followed by a PD block.">
<title>Two ways to build a PID controller. Parallel (ideal or ISA) form: P, I and D paths act side by side on the error and are added. Series (interacting) form: a PI block followed by a PD block.</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="700" height="300" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="20.0" y="26.0" font-size="15" text-anchor="start" fill="#0077b6" font-weight="600">Parallel (non-interacting) form</text>
<text x="30.0" y="116.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">e</text>
<path d="M42.0 110.0 L90.0 110.0" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M90.0 60.0 L90.0 160.0" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M90.0 60.0 L150.0 60.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="150.0" y="42.0" width="90.0" height="36.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="195.0" y="65.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">Kₚ</text>
<path d="M240.0 60.0 L300.0 60.0 L300.0 60.0" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M90.0 110.0 L150.0 110.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="150.0" y="92.0" width="90.0" height="36.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="195.0" y="115.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">Kᵢ / s</text>
<path d="M240.0 110.0 L300.0 110.0 L300.0 110.0" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M90.0 160.0 L150.0 160.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="150.0" y="142.0" width="90.0" height="36.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="195.0" y="165.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400">K<tspan baseline-shift="sub" font-size="70%">d</tspan> s</text>
<path d="M240.0 160.0 L300.0 160.0 L300.0 160.0" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M300.0 60.0 L330.0 100.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<path d="M240.0 110.0 L326.0 110.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<path d="M300.0 160.0 L330.0 120.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<path d="M240.0 60.0 L300.0 60.0" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M240.0 160.0 L300.0 160.0" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="342.0" cy="110.0" r="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="342.0" y="116.0" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="600">+</text>
<path d="M356.0 110.0 L410.0 110.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="424.0" y="116.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">u</text>
<text x="470.0" y="90.0" font-size="14" text-anchor="start" fill="#0f172a" font-weight="400" font-style="italic">u = Kₚe + Kᵢ∫e dt + K<tspan baseline-shift="sub" font-size="70%">d</tspan> de/dt</text>
<text x="470.0" y="115.0" font-size="12.5" text-anchor="start" fill="#64748b" font-weight="400">terms tuned independently;</text>
<text x="470.0" y="133.0" font-size="12.5" text-anchor="start" fill="#64748b" font-weight="400">standard in digital controllers</text>
<text x="20.0" y="216.0" font-size="15" text-anchor="start" fill="#0077b6" font-weight="600">Series (interacting) form</text>
<text x="30.0" y="266.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">e</text>
<path d="M42.0 260.0 L100.0 260.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="102.0" y="240.0" width="96.0" height="40.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="150.0" y="265.6" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="400">PI</text>
<path d="M198.0 260.0 L250.0 260.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="252.0" y="240.0" width="96.0" height="40.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="300.0" y="265.6" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="400">PD</text>
<path d="M348.0 260.0 L410.0 260.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="424.0" y="266.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">u</text>
<text x="470.0" y="250.0" font-size="12.5" text-anchor="start" fill="#64748b" font-weight="400">settings interact (cascaded);</text>
<text x="470.0" y="268.0" font-size="12.5" text-anchor="start" fill="#64748b" font-weight="400">classic analogue / pneumatic design</text>
</g>
</svg>
