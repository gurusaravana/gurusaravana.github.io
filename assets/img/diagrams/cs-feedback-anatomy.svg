<text x="463" y="69.0" font-size="12" text-anchor="middle" fill="#0077b6" font-weight="600">Manipulated</text>
<text x="463" y="84.0" font-size="12" text-anchor="middle" fill="#0077b6" font-weight="600">variable (MV)</text>
<rect x="522.0" y="72.0" width="116.0" height="46" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="580" y="91.75" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400">Process /</text>
<text x="580" y="107.35" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400">plant</text>
<path d="M638.0 95.0 L760.0 95.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="705" y="69.0" font-size="12" text-anchor="middle" fill="#db2777" font-weight="600">Controlled</text>
