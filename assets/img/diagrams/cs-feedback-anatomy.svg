<path d="M180.9 85.9L199.1 104.1M180.9 104.1L199.1 85.9" stroke="#0f172a" stroke-width="1.3"/>
<text x="169" y="88" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">+</text>
<text x="203" y="121" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">−</text>
<path d="M204.0 95.0 L290.0 95.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="247" y="83" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400">Error e</text>
