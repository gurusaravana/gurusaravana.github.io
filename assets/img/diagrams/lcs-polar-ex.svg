<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-label="Polar plot of 1 over s(1 + s)(1 + 2s): it starts far down the negative imaginary axis with an asymptote at real part minus 3, swings through the third and second quadrants and crosses the negative real axis at minus 0.667 when omega is 0.707, so the gain margin is 1.5; it meets the unit circle at 0.572 rad/s, giving a phase margin of 11.4 degrees">
