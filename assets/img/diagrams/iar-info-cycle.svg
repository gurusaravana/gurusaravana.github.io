<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 330" width="750" height="330" role="img" aria-label="Information processing cycle in a manufacturing firm: customer orders enter through business functions, pass through product design, manufacturing planning and manufacturing control, which runs the factory operations that deliver the product.">
<title>Information processing cycle in a manufacturing firm: customer orders enter through business functions, pass through product design, manufacturing planning and manufacturing control, which runs the factory operations that deliver the product.</title>
