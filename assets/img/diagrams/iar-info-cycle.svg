<rect width="750" height="330" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="270.0" y="20.0" width="180.0" height="46.0" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<text x="360.0" y="48.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="600">Customer</text>
<rect x="40.0" y="110.0" width="190.0" height="56.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="135.0" y="134.2" font-size="14" text-anchor="middle" fill="#7c3aed" font-weight="600">Business functions</text>
<text x="135.0" y="151.7" font-size="14" text-anchor="middle" fill="#7c3aed" font-weight="400">sales, orders, billing</text>
<rect x="490.0" y="110.0" width="190.0" height="56.0" rx="6" fill="#e0f2fe" stroke="#0077b6" stroke-width="2"/>
<text x="585.0" y="134.2" font-size="14" text-anchor="middle" fill="#0077b6" font-weight="600">Product design</text>
<text x="585.0" y="151.7" font-size="14" text-anchor="middle" fill="#0077b6" font-weight="400">R&amp;D, drafting, prototypes</text>
<rect x="490.0" y="210.0" width="190.0" height="56.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="585.0" y="234.2" font-size="14" text-anchor="middle" fill="#059669" font-weight="600">Manufacturing planning</text>
<text x="585.0" y="251.7" font-size="14" text-anchor="middle" fill="#059669" font-weight="400">process plans, schedules</text>
<rect x="40.0" y="210.0" width="190.0" height="56.0" rx="6" fill="#ffedd5" stroke="#ea7a1f" stroke-width="2"/>
<text x="135.0" y="234.2" font-size="14" text-anchor="middle" fill="#ea7a1f" font-weight="600">Manufacturing control</text>
<text x="135.0" y="251.7" font-size="14" text-anchor="middle" fill="#ea7a1f" font-weight="400">shop floor, quality, stock</text>
<rect x="265.0" y="270.0" width="190.0" height="46.0" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<text x="360.0" y="297.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="600">Factory operations</text>
