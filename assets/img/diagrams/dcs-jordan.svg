<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Jordan (diagonal) form for three distinct poles: the input drives three first-order loops in parallel, each a delay with self-feedback λi, and the states are weighted by the residues r1, r2, r3 and summed into the output, plus a direct path β0.">
