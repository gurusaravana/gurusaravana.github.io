<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Triangulation range sensing: a light source sends a narrow beam to the object; a detector a baseline B away sees the lit spot at angle theta, so the distance is D equals B times tan theta.">
