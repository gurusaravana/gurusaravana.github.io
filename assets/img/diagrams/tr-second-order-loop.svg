<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190" role="img" aria-label="Standard second-order system: unity negative feedback around omega n squared over s times s plus 2 zeta omega n, giving the closed loop omega n squared over s squared plus 2 zeta omega n s plus omega n squared">
<title>Standard second-order system: unity negative feedback around omega n squared over s times s plus 2 zeta omega n, giving the closed loop omega n squared over s squared plus 2 zeta omega n s plus omega n squared</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0077b6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea7a1f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<rect width="640" height="190" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="40.0" y="58.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">R(s)</text>
<path d="M20.0 70.0 L116.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<circle cx="130.0" cy="70.0" r="13" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<path d="M120.9 60.9L139.1 79.1M120.9 79.1L139.1 60.9" stroke="#0f172a" stroke-width="1.3"/>
<text x="109.0" y="63.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">+</text>
<text x="143.0" y="96.0" font-size="16" text-anchor="middle" fill="#db2777" font-weight="700">−</text>
