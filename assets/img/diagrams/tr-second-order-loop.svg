<text x="190.0" y="58.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">E(s)</text>
<rect x="240.0" y="38.0" width="160.0" height="64.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="320.0" y="64.0" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="400">ωₙ²</text>
<path d="M271.2 70.0 L368.8 70.0" fill="none" stroke="#0f172a" stroke-width="1.3"/>
<text x="320.0" y="88.0" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="400">s(s + 2ζωₙ)</text>
<path d="M400.0 70.0 L580.0 70.0" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#ak)"/>
<text x="560.0" y="58.0" font-size="15" text-anchor="middle" fill="#db2777" font-weight="400" font-style="italic">C(s)</text>
